<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Szavak — családi keresztrejtvény</title>
    <script>
      // Surface module-load failures inline since iPad has no devtools.
      function showFatal(label, detail) {
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML =
          '<pre style="padding:24px;color:#b91c1c;white-space:pre-wrap;font:13px ui-monospace,monospace">' +
          label + "\n" + detail + "</pre>";
      }
      // capture=true so we catch resource (script/link) load failures, which
      // don't bubble. Without this, a 404 on the module script is silent.
      window.addEventListener("error", function (e) {
        var t = e.target;
        if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) {
          showFatal("Resource failed to load", t.tagName + " " + (t.src || t.href));
        } else {
          showFatal(
            "JS error",
            (e.message || "unknown") +
              "\nat " + (e.filename || "?") + ":" + (e.lineno || "?") + ":" + (e.colno || "?"),
          );
        }
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        showFatal(
          "Unhandled promise rejection",
          (r && (r.stack || r.message)) || String(r),
        );
      });
      // If the React app never sets the mounted flag within 4s, fetch the
      // module script ourselves and report what the server actually returned.
      setTimeout(function () {
        if (document.documentElement.dataset.appMounted === "yes") return;
        var s = document.querySelector('script[type="module"]');
        if (!s || !s.src) {
          showFatal("Diagnostic", "No module script element found in HTML.");
          return;
        }
        fetch(s.src)
          .then(function (r) {
            var ct = r.headers.get("content-type") || "(none)";
            return r.text().then(function (t) {
              showFatal(
                "App did not mount within 4s",
                "Module URL: " + s.src + "\n" +
                  "Status: " + r.status + " " + r.statusText + "\n" +
                  "Content-Type: " + ct + "\n" +
                  "First 300 chars of body:\n" + t.slice(0, 300),
              );
            });
          })
          .catch(function (e) {
            showFatal(
              "App did not mount; fetch of module URL failed",
              "Module URL: " + s.src + "\nError: " + (e && (e.message || e)),
            );
          });
      }, 4000);
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root">
      <div style="font-family: system-ui, sans-serif; padding: 24px; color: #475569; text-align: center;">
        Szavak betöltése… ha ez az üzenet sokáig itt marad, a JavaScript
        nem futott le. Próbáld újratölteni a böngésző gyorsítótár nélkül.
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
