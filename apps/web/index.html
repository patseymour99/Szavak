<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Szavak — családi keresztrejtvény</title>
    <script>
      // Surface module-load failures inline since iPad has no devtools.
      // Using textContent (not innerHTML) so the bundle's `<` chars don't
      // get parsed as HTML and eat the diagnostic output.
      function showFatal(label, detail) {
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML = "";
        var pre = document.createElement("pre");
        pre.style.cssText =
          "padding:24px;color:#b91c1c;white-space:pre-wrap;font:13px ui-monospace,monospace";
        pre.textContent = label + "\n" + detail;
        root.appendChild(pre);
      }
      window.__diag = { events: [] };
      function logEvent(msg) {
        window.__diag.events.push(new Date().toISOString().slice(11, 19) + " " + msg);
      }
      // capture=true so we catch resource load failures (which don't bubble).
      window.addEventListener("error", function (e) {
        var t = e.target;
        if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) {
          logEvent("resource error: " + t.tagName + " " + (t.src || t.href));
        } else {
          logEvent("js error: " + (e.message || "unknown") + " at " + (e.filename || "?") + ":" + (e.lineno || "?"));
        }
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        logEvent("unhandledrejection: " + ((r && (r.stack || r.message)) || String(r)));
      });
      // After 4s, dump a complete diagnostic. We check both the
      // dataset flag and whether #root still holds the fallback DOM —
      // if the flag is set but the fallback is still visible, the
      // bundle started but React's render commit silently failed.
      setTimeout(function () {
        var mounted = document.documentElement.dataset.appMounted;
        var rootEl = document.getElementById("root");
        var stillHasFallback =
          rootEl && rootEl.innerHTML.indexOf("Próbáld újratölteni") >= 0;
        if (mounted === "yes" && !stillHasFallback && window.__diag.events.length === 0) {
          return; // App is healthy.
        }
        var s = document.querySelector("script[src*='assets/index-']");
        var info = [
          "UA: " + navigator.userAgent,
          "Origin: " + location.origin,
          "appMounted flag: " + (mounted || "(unset)"),
          "fallback still visible: " + (stillHasFallback ? "yes" : "no"),
          "Script tag in DOM: " + (s ? "yes" : "NO"),
          "Script src: " + (s && (s.src || s.getAttribute("src"))),
          "Script type attr: " + (s && (s.getAttribute("type") || "(none — classic)")),
          "Captured events: " + (window.__diag.events.length === 0 ? "(none)" : ""),
        ].concat(window.__diag.events).join("\n");
        showFatal("Diagnostic", info);
      }, 4000);
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root">
      <div style="font-family: system-ui, sans-serif; padding: 24px; color: #475569; text-align: center;">
        Szavak betöltése… ha ez az üzenet sokáig itt marad, a JavaScript
        nem futott le. Próbáld újratölteni a böngésző gyorsítótár nélkül.
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
