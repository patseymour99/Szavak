# fly.toml app configuration file generated for szavak on 2026-05-05T08:45:35Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'szavak'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_URL = 'file:/data/szavak.db'
  HOST = '0.0.0.0'
  NODE_ENV = 'production'
  PORT = '3001'
  TIMEZONE = 'Europe/Budapest'

[http_service]
  # Must match PORT above — the server listens on 3001.
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
