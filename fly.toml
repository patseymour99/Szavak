# fly.toml — Szavak deployment
# After `flyctl launch --copy-config` set:
#   flyctl secrets set SESSION_SECRET="$(openssl rand -hex 32)" \
#                      ADMIN_BOOTSTRAP_PIN=1234
#   flyctl volumes create szavak_data --size 1 --region fra
#   flyctl deploy

app = "szavak"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  HOST = "0.0.0.0"
  TIMEZONE = "Europe/Budapest"
  NODE_ENV = "production"
  # SQLite database lives on the persistent volume so it survives deploys.
  DATABASE_URL = "file:/data/szavak.db"
  # The web app and API are served from the same origin, so CORS only needs
  # to allow the Fly URL itself; set to an explicit URL after `flyctl launch`
  # if you change app name.
  WEB_ORIGIN = "https://szavak.fly.dev"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[mounts]
  source = "szavak_data"
  destination = "/data"
